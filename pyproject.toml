[project]
name = "quadrupole"
version = "0.4.0"
description = "Classes for reading and manipulating molecular quadrupole moments."
readme = "PyPI_README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Brock Dyer", email = "brockdyer03@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0.0",
]
classifiers = [
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-random-order>=1.2.0",
    "ruff>=0.14.10",
]
docs = [
    "sphinx>=9.1.0",
    "pydata-sphinx-theme>=0.16.1, <0.17.0", # https://github.com/pydata/pydata-sphinx-theme/issues/2349
    "numpydoc>=1.10.0",
    "sphinx-design>=0.7.0",
]

[project.urls]
source = "https://github.com/brockdyer03/quadrupole"
docs = "https://quadrupole.readthedocs.io/en/latest/index.html"
issues = "https://github.com/brockdyer03/quadrupole/issues"

[tool.ruff]
line-length = 100
indent-width = 4

[tool.ruff.format]
docstring-code-format = false

[tool.ruff.lint]
select = [
    "YTT",
    "BLE001",
    "FBT",
    "B",
    "A",
    "FA",
    "ISC",
    "I",
    "PT",
    "Q003",
    "RET",
    "SIM",
    "ARG",
    "NPY001",
    "E101",
    "E401",
    "E501",
    "E701",
    "E702",
    "E703",
    "E711",
    "E713",
    "E714",
    "E721",
    "E731",
    "W",
    "F",
    "PLE",
    "PLR1722",
    "PLW",
    "RUF",
    "TRY",
]
ignore = [
    # These are disabled because it feels like code is more readable without them
    "RET505", # Branch after return
    "RET506", # Branch after raise
    "RET507", # Branch after continue
    "RET508", # Branch after break
    "PLW1641", # Implement __eq__ without __hash__
    "SIM102", # Use single if instead of nested if
    "SIM114", # if with same arms.

    # We use Greek letters in lattice terminology.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.pytest]
addopts = [
    "--cov=quadrupole",
    "--cov-report=term-missing",
    "--cov-branch",
    "--random-order",
]
testpaths = ["tests"]
strict_xfail = true
